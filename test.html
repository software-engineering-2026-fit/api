
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My App</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-100">
    <div class="max-w-md mx-auto mt-20 p-6 bg-white rounded shadow">
      <h1 class="text-2xl font-bold mb-4">Login</h1>

      <form id="loginForm" class="space-y-4">
        <input
          id="email"
          type="email"
          placeholder="Email"
          class="w-full border p-2 rounded"
          required
        />

        <input
          id="password"
          type="password"
          placeholder="Password"
          class="w-full border p-2 rounded"
          required
        />

        <button
          type="submit"
          class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700"
        >
          Login
        </button>
      </form>

      <div id="message" class="mt-4 text-sm"></div>

      <button
        id="loadMeBtn"
        class="mt-6 w-full bg-gray-800 text-white p-2 rounded hidden"
      >
        Load my profile
      </button>

      <pre id="result" class="mt-4 bg-slate-50 p-3 rounded text-xs overflow-auto"></pre>
    </div>

    <script>
      const API = "http://localhost:8000";

      const loginForm = document.getElementById("loginForm");
      const messageBox = document.getElementById("message");
      const resultBox = document.getElementById("result");
      const loadMeBtn = document.getElementById("loadMeBtn");

      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        const formData = new URLSearchParams();
        formData.append("username", email);
        formData.append("password", password);

        try {
          const res = await fetch(`${API}/auth/token`, {
            method: "POST",
            headers: {
              "Content-Type": "application/x-www-form-urlencoded"
            },
            body: formData.toString()
          });

          const data = await res.json();

          if (!res.ok) {
            throw new Error(data.detail || "Login failed");
          }

          localStorage.setItem("token", data.access_token);
          messageBox.textContent = "Login successful";
          messageBox.className = "mt-4 text-sm text-green-600";
          loadMeBtn.classList.remove("hidden");
        } catch (err) {
          messageBox.textContent = err.message;
          messageBox.className = "mt-4 text-sm text-red-600";
        }
      });

      loadMeBtn.addEventListener("click", async () => {
        const token = localStorage.getItem("token");

        if (!token) {
          resultBox.textContent = "No token found";
          return;
        }

        try {
          const res = await fetch(`${API}/auth/me`, {
            headers: {
              Authorization: `Bearer ${token}`
            }
          });

          const data = await res.json();

          if (!res.ok) {
            throw new Error(data.detail || "Could not fetch profile");
          }

          resultBox.textContent = JSON.stringify(data, null, 2);
        } catch (err) {
          resultBox.textContent = err.message;
        }
      });
    </script>
  </body>
</html>
